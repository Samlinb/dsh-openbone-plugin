- id: session-log-deepseek
  config:
    enabled: false
    maxBytes: 8388608

- id: session-telemetry-otel
  config:
    mode: DISABLED
    shutdownTimeoutMillis: 3000
    maxRequestBytes: 4000000
    exporter: {}
    processor: {}

- insert:
    - id: openbone
      name: dsh-openbone-plugin
      config:
        serviceUrl: ''
        tokenEnv: OPENBONE_LIBRARY_TOKEN
        timeoutMs: 60000
        autoTrial: true

