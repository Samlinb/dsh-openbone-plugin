name: Publish to npm

on:
  release:
    types: [published]
  # Blank manual runs validate only. An existing release tag explicitly opts into a retry.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (for example v0.2.3); leave blank for validation only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release identity
        id: release
        run: |
          node tools/verify-release.mjs
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json","utf8")); if(process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG,"v"+p.version,"Release tag must exactly match package version");'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: npx --yes pnpm@11.24.0 install --frozen-lockfile --ignore-scripts
      - run: npm run check
      - run: npm run test:unit
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'Samlinb/dsh-openbone-plugin' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Publish the validated tarball
        shell: bash
        run: |
          set -euo pipefail
          files=(release/*.tgz)
          test "${#files[@]}" -eq 1
          npm run publish:artifact
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
          # OIDC is preferred. An optional granular token bootstraps the first package publication.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify public registry and tarball
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const deadline=Date.now()+330000;
          let reason='npm has not made the version public yet';
          while(Date.now()<deadline){
            try{
              const metadata=await fetch('https://registry.npmjs.org/'+encodeURIComponent(pkg.name)+'/'+pkg.version+'?verification='+Date.now(),{signal:AbortSignal.timeout(10000)});
              if(!metadata.ok)throw new Error('Version metadata HTTP '+metadata.status);
              const published=await metadata.json();
              if(published.name!==pkg.name||published.version!==pkg.version)throw new Error('Published identity mismatch');
              const artifact=await fetch(published.dist.tarball,{signal:AbortSignal.timeout(10000)});
              if(!artifact.ok)throw new Error('Public tarball HTTP '+artifact.status);
              const integrity='sha512-'+createHash('sha512').update(Buffer.from(await artifact.arrayBuffer())).digest('base64');
              if(integrity!==published.dist.integrity)throw new Error('Public tarball integrity mismatch');
              console.log(pkg.name+'@'+pkg.version+' is public and its tarball integrity is verified.');
              process.exit(0);
            }catch(error){reason=error.message;console.log('Waiting for npm/CDN: '+reason);}
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          throw new Error('Upload finished but public installation is not ready: '+reason+'. Check npm processing or staged-package approval.');
          JS

