name: Publish to npm

on:
  release:
    types: [published]
  # Blank manual runs validate only. An existing release tag explicitly opts into a retry.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (for example v0.2.3); leave blank for validation only'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate release identity
        id: release
        run: |
          node tools/verify-release.mjs
          node --input-type=module -e 'import assert from "node:assert/strict"; import {readFileSync} from "node:fs"; const p=JSON.parse(readFileSync("package.json","utf8")); if(process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG,"v"+p.version,"Release tag must exactly match package version");'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: npm run check
      - run: npm run test:unit
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.repository == 'Samlinb/dsh-openbone-plugin' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.16.0
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release
      - name: Publish the validated tarball
        shell: bash
        run: |
          set -euo pipefail
          files=(release/*.tgz)
          test "${#files[@]}" -eq 1
          npm publish "./${files[0]}" --access public --registry=https://registry.npmjs.org/ --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
          # OIDC is preferred. An optional granular token bootstraps the first package publication.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

